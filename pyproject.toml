[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "roboatom"
version = "0.1.0"
description = "Atomic-action annotation, video inference, PhysExtend, and benchmark evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.23", "PyYAML>=6"]
[project.optional-dependencies]
annotation = ["Flask>=2.2,<4", "boto3>=1.28", "openai>=1", "httpx>=0.24", "av>=10", "opencv-python-headless>=4.8,<5", "mmengine-lite>=0.10,<1"]
physextend = ["pyarrow>=12", "av>=10", "opencv-python-headless>=4.8,<5", "Pillow>=9", "scipy>=1.9"]
inference = ["torch>=2.7", "torchvision>=0.22", "transformers==5.8.0", "accelerate>=1.5", "av>=18", "Pillow>=12", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28"]
[project.scripts]
roboatom = "roboatom.cli:main"
[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES/*"]
[tool.setuptools.packages.find]
where = ["src"]
include = ["roboatom*"]
[tool.setuptools.package-data]
"roboatom.annotation" = ["templates/*.html", "static/*.css", "static/js/*.js"]
"roboatom.physextend.data" = ["recipes/*.json", "configs/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
